spring.application.name=wallet
server.port=9090

# PostgreSQL connection. Override credentials with environment variables outside local development.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/walletdb}
spring.datasource.username=${DATABASE_USERNAME:wallet}
spring.datasource.password=${DATABASE_PASSWORD:wallet}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.lock.timeout=3000

# Supply a private random secret through JWT_SECRET outside local development (minimum 32 bytes).
wallet.jwt.secret=${JWT_SECRET}
wallet.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Optional bootstrap admin. Set both values to enable the admin account.
wallet.admin.email=${WALLET_ADMIN_EMAIL:}
wallet.admin.password=${WALLET_ADMIN_PASSWORD:}

# Idempotency lifecycle policy
wallet.idempotency.replay-window-hours=24
wallet.idempotency.retention-days=7
wallet.idempotency.cleanup-cron=0 0 2 * * *

# Overload protection
wallet.transfer.rate-limit-per-second=1000
wallet.transfer.max-inflight=200
wallet.transfer.circuit-breaker.failure-threshold=20
wallet.transfer.circuit-breaker.open-seconds=15

# Retry policy
wallet.retry.create-user.max-attempts=4
wallet.retry.create-user.delay-ms=25
wallet.retry.create-user.max-delay-ms=300
